# Development only. No production infrastructure or credentials.
name: fashion-local
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fashion_local
      POSTGRES_USER: local_migrator
      POSTGRES_PASSWORD: ${LOCAL_DB_OWNER_PASSWORD:?Export LOCAL_DB_OWNER_PASSWORD}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:?Export LOCAL_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./local/init-runtime.sql:/docker-entrypoint-initdb.d/10-runtime.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U local_migrator -d fashion_local"]
      interval: 2s
      timeout: 5s
      retries: 30
  clamav:
    # Official supported ClamAV LTS release. Tag is exact; registry digest remains to be independently verified.
    image: clamav/clamav:1.4.6
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-definitions:/var/lib/clamav
      - ./local/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    # Inherit the official image's clamd PING/PONG health check rather than
    # assuming an additional shell utility is present in the image.
volumes:
  postgres-data:
  clamav-definitions:
