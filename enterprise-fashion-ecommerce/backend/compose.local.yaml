# Development only. No production infrastructure or credentials.
name: fashion-local
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fashion_local
      POSTGRES_USER: local_migrator
      POSTGRES_PASSWORD: ${LOCAL_DB_OWNER_PASSWORD:?Export LOCAL_DB_OWNER_PASSWORD}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:?Export LOCAL_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./local/init-runtime.sql:/docker-entrypoint-initdb.d/10-runtime.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U local_migrator -d fashion_local"]
      interval: 2s
      timeout: 5s
      retries: 30
  clamav:
    # Official ClamAV LTS image verified for the development runtime on 2026-11-11.
    image: clamav/clamav:1.4.6@sha256:cbc30de94b6e9b33ac14136ff45306cee02a1f9ae522394a3cc5b9215d1affe9
    platform: linux/amd64
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-definitions:/var/lib/clamav
      - ./local/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    # The verified image supplies nc. Use IPv4 explicitly because its inherited
    # localhost probe does not reach clamd when this configuration binds IPv4.
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(echo PING | nc 127.0.0.1 3310)\" = PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 360s
volumes:
  postgres-data:
  clamav-definitions:
