# Development only. No production infrastructure or credentials.
name: fashion-local
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fashion_local
      POSTGRES_USER: local_migrator
      POSTGRES_PASSWORD: ${LOCAL_DB_OWNER_PASSWORD:?Export LOCAL_DB_OWNER_PASSWORD}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:?Export LOCAL_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./local/init-runtime.sql:/docker-entrypoint-initdb.d/10-runtime.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U local_migrator -d fashion_local"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
