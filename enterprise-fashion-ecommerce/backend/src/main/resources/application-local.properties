# Explicitly activated development profile only; secrets have no checked-in defaults.
server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/fashion_local
spring.datasource.username=local_app
spring.datasource.password=${LOCAL_DB_PASSWORD}
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=local_migrator
spring.flyway.password=${LOCAL_DB_OWNER_PASSWORD}
spring.flyway.clean-disabled=true
product.catalogue.cursor-secret=${PRODUCT_CATALOGUE_CURSOR_SECRET}
product.media.clamav.host=127.0.0.1
product.media.clamav.port=3310
product.media.clamav.connect-timeout-millis=1000
product.media.clamav.read-timeout-millis=5000
product.media.clamav.maximum-stream-bytes=8388608
product.media.clamav.maximum-response-bytes=4096
product.media.clamav.maximum-signature-age=PT48H
product.media.clamav.signature-clock-skew-tolerance=PT5M
# Spring Session settings are inherited; Flyway remains the schema authority.
