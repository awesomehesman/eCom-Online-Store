spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=identity.spring_session
# A clean malware result is fail-closed unless the observed signature database
# is no older than 48 hours and no more than five minutes ahead of this host.
product.media.clamav.maximum-signature-age=PT48H
product.media.clamav.signature-clock-skew-tolerance=PT5M
